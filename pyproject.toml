[project]
name = "sam3"
version = "0.1.0"
description = "SAM3 text-prompted image segmentation API (local FastAPI + Runpod Flash)"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "accelerate>=1.14.0",
    "fastapi>=0.141.1",
    "numpy>=2.5.2",
    "opencv-python-headless>=5.0.0.93",
    "pillow>=12.3.0",
    "pydantic>=2",
    "python-multipart>=0.0.32",
    "runpod-flash>=1.19",
    "torch>=2.14",
    "torchvision>=0.29.0",
    "transformers>=5.16",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
